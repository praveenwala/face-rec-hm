# Phase 1 (Mac POC) stack. Isolated from production — nothing here talks to the real
# Home Assistant instance at 192.168.68.103 or its Mosquitto broker (constitution I.1;
# research.md #4, #10). See plan.md and pre-development-validation.md.
#
# Image tags below are pinned per constitution VI.3; re-confirm/update them during T013
# (Frigate baseline validation) if a newer stable tag is preferred at execution time.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: face-rec-phase1-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    container_name: face-rec-phase1-frigate
    restart: unless-stopped
    shm_size: "512mb"
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:${FRIGATE_UI_PORT:-5000}:5000" # loopback-only (runtime hardening: no LAN exposure of face-mgmt API)
      - "127.0.0.1:8554:8554" # go2rtc RTSP restream — loopback-only (local test consumers use rtsp://127.0.0.1:8554)
    volumes:
      - ./frigate/config:/config
      - ./tests/phase1/test-media:/media/test-source:ro
      - /tmp/frigate-phase1-cache:/tmp/cache
      # Persistent, gitignored Frigate data volume (runtime hardening): enrolled face
      # crops and runtime media survive container restart AND recreation. ./frigate/media
      # is ignored by .gitignore (frigate/media/) — never committed (constitution II.4-II.5).
      - ./frigate/media:/media/frigate
    environment:
      - TZ=${TZ:-UTC}
      # 0.17 breaking change (upgraded 2026-09-09 from 0.15.1): go2rtc exec:/echo:/expr:
      # sources are blocked by default for security. The Phase 1 sample-media loop uses a
      # go2rtc exec producer (frigate/config/config.yml) to feed the validated test clip,
      # so re-enable the exec source via the official documented env var. LOCAL DEV POC
      # ONLY — the production Ring path (Phase 5) uses plain rtsp:// sources and must NOT
      # set this. See https://docs.frigate.video/configuration/restream (0.17 release notes).
      - GO2RTC_ALLOW_ARBITRARY_EXEC=true

  ha-throwaway:
    image: ghcr.io/home-assistant/home-assistant:2024.12.5
    container_name: face-rec-phase1-ha-throwaway
    restart: unless-stopped
    depends_on:
      - mosquitto
      - frigate
    ports:
      - "${HA_THROWAWAY_PORT:-8124}:8123"
    volumes:
      - ./home-assistant/throwaway-config:/config
    environment:
      - TZ=${TZ:-UTC}

  # Phase 2 (Constitution Phase 2): ring-mqtt bridge for the live Ring Front Door stream.
  # BOUNDED-USE ONLY — Ring cameras are cloud/on-demand devices; continuous streaming is
  # explicitly unsupported by ring-mqtt (loses motion/ding events, drains batteries,
  # risks overheating). This service exists so T028-T029 can prove the live RTSP path in
  # short, deliberate test windows; the Frigate source is switched back to the looped
  # sample clip immediately after (docs/testing/local-mac-testing.md §12/§15).
  #
  # - config.json (mqtt_url etc.) and ring-state.json (Ring refresh token!) are created
  #   by the bundled init-ring-mqtt.js CLI and live in ./ring-mqtt/data (gitignored,
  #   never committed — constitution II.4). See ring-mqtt/README.md.
  # - RTSP port 8554 inside the container; on the host it is bound to 127.0.0.1:18554
  #   ONLY (Frigate's own go2rtc owns host 8554, and loopback-only keeps the unauthenticated
  #   RTSP endpoint off the LAN). Frigate consumes the stream internally at
  #   rtsp://ring-mqtt:8554/<camera_id>_live over the compose network.
  # - livestream_user/livestream_pass RTSP auth is deliberately NOT enabled for this
  #   Mac-local bounded test (loopback-only binding = no LAN exposure, and credentials in
  #   the git-tracked frigate config would violate II.4). Production (Phase 5) MUST enable
  #   it per the ring-mqtt wiki.
  ring-mqtt:
    image: tsightler/ring-mqtt:5.9.3
    container_name: face-rec-phase1-ring-mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:18554:8554" # local RTSP gateway (loopback-only, bounded tests only)
    volumes:
      - ./ring-mqtt/data:/data
    environment:
      - TZ=${TZ:-UTC}
