server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the backend service over the compose network
    # (service name "enrollment-backend", internal port 8000).
    location /api/ {
        proxy_pass http://enrollment-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: client-side routes (e.g. /people/<id>) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching surprises for the hashed build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}