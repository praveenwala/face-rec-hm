# Feature 002 — Known Person Enrollment Manager (Dockerized, localhost-only).
#
# Standalone stack: `docker compose -f docker-compose.enrollment.yml up -d --build`
# then open http://127.0.0.1:8090 in your browser.
#
# Privacy/security invariants (see enrollment-app/README.md):
# - BOTH host port bindings are loopback-only (127.0.0.1). Nothing is exposed to
#   the LAN or the Internet; the app is a localhost-only management surface.
# - All runtime data (app.db, people/, models/) lives under ./enrollment-app/data,
#   which is gitignored and bind-mounted read-write — never in the images.
# - Feature 002's Frigate enrollment integration EXISTS and is real (not a stub). It is
#   explicit and feature-gated: the single gate is FRIGATE_ENROLLMENT_ENABLED, which
#   defaults to OFF/false — the steady state. It may be enabled only for an explicitly
#   authorized, bounded enrollment/test window, then restored to OFF. While OFF, every
#   mutating call refuses up-front (501 FEATURE_NOT_ENABLED) with zero Frigate mutation.
#   When enabled, enrollment-backend reaches the Feature 001 Frigate container over the
#   shared default network and mounts only Frigate's faces/train/ crop directory
#   (train-only, RW) — never the reference identity directories. No HA/MQTT integration
#   exists in this stack either way. T035 (stable Known-person recognition producing a
#   matching sub_label) remains pending in every environment; enrollment/removal success
#   is not evidence of that path.
# - The face-detection model is read from ./enrollment-app/data/models/facedet.onnx
#   (gitignored). Fetch it once on the host with:
#       enrollment-app/scripts/fetch_models.sh
#   (the script also works when the container stack is not running).
#
# Independent of docker-compose.yml (Feature 001 POC stack): run either or both —
# the enrollment stack binds 8000/8090, the 001 stack binds 1883/5000/8554/8124/18554.

services:
  enrollment-backend:
    build:
      context: ./enrollment-app
      dockerfile: Dockerfile.backend
    container_name: face-rec-enrollment-backend
    restart: unless-stopped
    environment:
      - ENROLLMENT_DATA_DIR=/data
      # Active Frigate reachable via the shared face-recognition_default network on its
      # container-internal port 5000 (host mapping 5001 is NOT reachable from inside this
      # container). Enrollment mutation stays gated OFF by default.
      - FRIGATE_API_URL=http://face-rec-phase1-frigate:5000
      - FRIGATE_FACES_DIR=/frigate-faces
    ports:
      # Loopback-only exposure. The container's uvicorn listens on 0.0.0.0
      # internally; only 127.0.0.1:8000 reaches it from the host.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./enrollment-app/data:/data
      # Minimal train-only mount (RW). Scopes container access to the Frigate
      # face-training crop directory only; no access to reference identity dirs.
      - ./frigate/media/clips/faces/train:/frigate-faces/train
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  enrollment-frontend:
    build:
      context: ./enrollment-app
      dockerfile: Dockerfile.frontend
    container_name: face-rec-enrollment-frontend
    restart: unless-stopped
    depends_on:
      - enrollment-backend
    ports:
      # Loopback-only UI on a host port that doesn't clash with the native
      # `npm run dev` port (5173).
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s