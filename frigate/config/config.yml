# Phase 1 (Mac POC) minimal config. Person detection is the base; native face
# recognition (small model, CPU-only) was enabled at T032 after PD-09 passed on this
# Intel host (constitution V.1 — build incrementally; FR-001/FR-002).
# See contracts/mqtt-events.md for the frigate/events shape HA automations rely on later.

# MQTT (production broker connectivity — MQTT-B5). Points the dev Frigate at the production
# Home Assistant Mosquitto broker (authenticated, no TLS on trusted LAN; see the gitignored
# .env for the actual host/port — never the real value here or in .env.example).
# Credentials are injected via env vars that MUST begin with FRIGATE_ (Frigate 0.17 syntax:
# single-brace '{FRIGATE_*}'). The values live ONLY in the gitignored .env (see .env.example
# for placeholders) — never committed. Revert this block (back to host: mosquitto, no auth)
# to roll back to the isolated single-host POC broker.
# `topic_prefix: frigate` is intentionally the current single-Frigate topic contract —
# production HA's deployed normalization automation already consumes `frigate/events` under
# this exact prefix. Before ever connecting a second Frigate instance (e.g. the eventual
# Phase 5 production host) to this same broker, define distinct topic prefixes/routing and
# update the HA consumer(s) deliberately — do not silently share `frigate/*` between two
# Frigate instances.
mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}"
  port: 1883
  topic_prefix: frigate
  client_id: frigate_macdev
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# go2rtc is bundled in the Frigate image. The "exec" producer loops the sample test video
# via ffmpeg (research.md #3) so Frigate always has a live-looking RTSP source without a
# real Ring stream. /media/test-source is tests/phase1/test-media/ (docker-compose.yml),
# mounted read-only — deliberately NOT at /media directly, since Frigate itself needs
# /media/frigate writable for its own clips/recordings/exports/db (found during T013).
# PLACEHOLDER: known-person-walk.mp4 does not exist until T008 provides sample media —
# this stream will fail to start until that file is in place. Swap the filename to test
# other clips (e.g. no-person-motion.mp4 for T021/T016's negative test).
go2rtc:
  streams:
    front_door_test:
      # {{output}} is doubled: Frigate applies its own {}-format pass over this string
      # before handing it to go2rtc, so a single {output} raises "Invalid substitution
      # found" (found during T013 — see docs.frigate.video/configuration/restream#advanced-restream-configurations).
      # go2rtc's exec producer runs with a minimal PATH that doesn't include Frigate's own
      # ffmpeg build dirs, so bare `ffmpeg` fails with "executable file not found in $PATH"
      # (also found during T013) — use the absolute path to Frigate's bundled ffmpeg 7.0.
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -re -stream_loop -1 -i /media/test-source/known-person-walk.mp4 -c copy -f rtsp {{output}}"

cameras:
  front_door:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door_test
          roles:
            - detect
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
    # Face recognition runs on the person detection (constitution III.1 — person first,
    # then face). Camera-level face_recognition block not needed: global enable below
    # applies to all cameras, and no per-camera min_area override is warranted yet.
    record:
      enabled: false
    snapshots:
      enabled: true
      retain:
        default: 3 # short retention for Phase 1 debugging only (constitution II.5)

# Native face recognition — T032 (Phase 3), small model only (CPU; this Intel Mac POC).
# SMALL model (FaceNet embedding) needs no accelerator; the LARGE model (ArcFace) requires
# GPU/NPU and stays production-only (PD-09 evidence, validation-report.md).
# No identities are enrolled yet, so the expected result is Unknown / no named match —
# the pipeline must run safely with an empty face library (FR-002, FR-005).
# Thresholds below are the Frigate 0.17.2 DEFAULTS written explicitly — baseline POC
# values, NOT tuned, and NOT final production thresholds: they are conservative and
# favor Unknown over a false identity (constitution II.2, FR-006). T033/T034+ will
# evaluate recognition behavior once identities are enrolled and may tune them; until
# then, Unknown remains the safe default.
face_recognition:
  enabled: true
  model_size: small
  detection_threshold: 0.7   # min face-detection score to consider a face
  unknown_score: 0.8         # min distance score to mark a potential match
  recognition_threshold: 0.9 # min distance score to assign a known identity
  save_attempts: 20          # bounded recognition-attempt crop retention (privacy);
                             # enrolled identity crops are separate and unaffected

version: 0.17-0
